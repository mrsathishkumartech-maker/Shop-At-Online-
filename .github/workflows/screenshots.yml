name: Screenshots

# Boots an Android emulator, installs every game and captures screenshots.
# Runs after changes to games/ on main, or by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths: ['games/**', 'core/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run games in the emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Publish screenshots to the 'screenshots' branch
        if: always()
        run: |
          shopt -s nullglob
          files=(screenshots/*.png)
          if (( ${#files[@]} == 0 )); then echo "No screenshots to publish"; exit 0; fi
          dir=$(mktemp -d)
          cp screenshots/*.png "$dir/"
          {
            echo "# Screenshots"
            echo
            echo "From commit ${GITHUB_SHA::7}, captured on an Android 14 emulator (Pixel 6)."
            echo
            for f in "$dir"/*.png; do n=$(basename "$f"); echo "### ${n%.png}"; echo; echo "<img src=\"$n\" width=\"300\">"; echo; done
          } > "$dir/README.md"
          cd "$dir"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
